[project]
name = "aye-kitchen"
version = "1.0.0"
description = "AyeKitchen Microservice Backend — Costeo de recetas y pedidos"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Un solo event loop: el cliente real de Motor (TEST_MONGODB_URL) queda atado al loop de la sesión
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
